[mod-setting-description]

bbprod-ignore-recipe=Recipe IDs to ignore. Do not confuse these with item, fluid, or product IDs.\n[font=default-bold]Format:[/font] recipe1;recipe2;...\n[font=default-bold]Example:[/font] advanced-oil-processing;...\n[font=default-bold]Advanced usage:[/font] "[color=orange]--[/color]" removes a value: "--advanced-oil-processing".

bbprod-ignore-group=Recipes with the same main product are merged into a single group. This setting specifies product IDs to ignore.\n[font=default-bold]Format:[/font] item1;fluid2;capsule3;...\n[font=default-bold]Example:[/font] barrel;water;bioflux;...\n[font=default-bold]Advanced usage:[/font] "[color=orange]--[/color]" removes a value: "--barrel" 

bbprod-add-group=Only recipes that allow productivity are included by default. This setting specifies product IDs to add.\n[font=default-bold]Format:[/font] item1;fluid2;capsule3;...\n[font=default-bold]Example:[/font] firearm-magazine;...\n[font=default-bold]Advanced usage:[/font] "[color=orange]--[/color]" removes a value: "--firearm-magazine".

bbprod-merge-group=Merge multiple product groups into the same technology. You may specify a custom group name; adding a localized name through another mod is recommended.\n[font=default-bold]Format:[/font] main_group = group1, group2 ; ...\n[font=default-bold]Example:[/font] uranium-235 = uranium-235, uranium-238, uranium-fuel-cell ; ...\n[font=default-bold]Advanced usage:[/font] "[color=orange]--[/color]" removes a value: "uranium-chain=--".

bbprod-unit=A unit preset determines the cost in items and time of the technology.\n[font=default-bold]Built-in presets:[/font] "military", "chemical", "production", "utility", "space", "science-pack", [space-age] "vulcanus", "fulgora", "gleba" and "aquilo". You can override these presets or define new ones.\n[font=default-bold]Format:[/font] unit = formula, time, pack1+pack2+pack3 ; ...\n[font=default-bold]Example:[/font] logistic = 1.5^L*1000, 60, automation-science-pack + logistic-science-pack ; ...\n[color=blue]See the Factorio API Docs / Prototype / Types / TechnologyUnit.[/color]

bbprod-alt-main-result=Sometimes a different product is preferred as the technology's name and icon. Replace a group's main product with another product.\n[font=default-bold]Format:[/font] main_group = type,name ; ...\n[font=default-bold]Example:[/font] jellynut-seed = capsule,jelly ; ...\n[font=default-bold]Advanced usage:[/font] "[color=orange]--[/color]" removes a value: "jellynut-seed=--".

bbprod-unit-from-category=First, the mod assigns a unit preset to each product group based on the recipe category.\n[font=default-bold]Format:[/font] recipe_category = unit ; ...\n[font=default-bold]Example:[/font] smelting = vulcanus ; organic = ignore ; ...\n[font=default-bold]Advanced usage:[/font]\n"[color=orange]--[/color]" removes a value: "crushing=--".\n[color=orange]ignore[/color]" no research for products with that category.

bbprod-unit-from-special=After category assignment, the mod assigns a unit preset to product groups with special properties.\n[font=default-bold]Valid properties:[/font] "any" (default), "fluid", "fuel", "science-pack".\n[font=default-bold]Example:[/font] any=production; fuel=space\n[font=default-bold]Advanced usage:[/font]\n"[color=orange]--[/color]" removes a value: "fuel=--".\n[color=orange]ignore[/color]" no research for products with that property.

bbprod-unit-from-group=Finally, the mod assigns a unit preset to product groups based on their name.\n[font=default-bold]Format:[/font] group_name = unit ; ...\n[font=default-bold]Example:[/font] flying-robot-frame = utility ; barrel = ignore ; ...\n[font=default-bold]Advanced usage:[/font]\n"[color=orange]--[/color]" removes a value: "rocket-part=--".\n[color=orange]ignore[/color]" no research for products with that group.

bbprod-remove-space-age-tech=Removes the productivity technologies added by Space Age.
