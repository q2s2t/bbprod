[mod-setting-description]

bbprod-ignore-recipes=Recipe IDs to ignore. Do not confuse these with item, fluid, or product IDs.\n[font=default-bold]Format:[/font] recipe1;recipe2;...\n[font=default-bold]Example:[/font] advanced-oil-processing;...

bbprod-ignore-group=Recipes with the same main product are merged into a single group. This setting specifies product IDs to ignore.\n[font=default-bold]Format:[/font] item1;fluid2;capsule3;...\n[font=default-bold]Example:[/font] barrel;water;bioflux;...

bbprod-merge-group=Merge multiple product groups into the same technology. You may specify a custom group name; adding a localized name through another mod is recommended.\n[font=default-bold]Format:[/font] main_group = group1, group2 ; ...\n[font=default-bold]Example:[/font] uranium-235 = uranium-235, uranium-238, uranium-fuel-cell ; ...

bbprod-unit=A unit preset determines the cost in items and time of the technology.\n[font=default-bold]Built-in presets:[/font] "military", "chemical", "production", "space", "vulcanus", "fulgora", "gleba", "aquilo", and "science-pack". You can override these presets or define new ones.\n[font=default-bold]Format:[/font] unit = formula, time, pack1+pack2+pack3 ; ...\n[font=default-bold]Example:[/font] logistic = 1.5^L*1000, 60, automation-science-pack + logistic-science-pack ; ...\n[color=blue]See the Factorio API Docs / Prototype / Types / TechnologyUnit.[/color]

bbprod-alt-main-result=Sometimes a different product is preferred as the technology's name and icon. Replace a group's main product with another product.\n[font=default-bold]Format:[/font] main_group = type,name ; ...\n[font=default-bold]Example:[/font] jellynut-seed = capsule,jelly ; ...

bbprod-unit-from-category=First, the mod assigns a unit preset to each product group based on the recipe category.\n[font=default-bold]Format:[/font] recipe_category = unit ; ...\n[font=default-bold]Example:[/font] smelting = vulcanus ; organics = gleba ; ...

bbprod-unit-from-special=After category assignment, the mod assigns a unit preset to product groups with special properties.\n[font=default-bold]Valid properties:[/font] "any" (default), "fluid", "fuel", "science-pack", and "ignore" (ignores all products with that property).\n[font=default-bold]Example:[/font] any=production; fuel=space

bbprod-unit-from-group=Finally, the mod assigns a unit preset to product groups based on their name.\n[font=default-bold]Format:[/font] group_name = unit ; ...\n[font=default-bold]Example:[/font] flying-robot-frame = utility ; ...

bbprod-remove-space-age-tech=Removes the productivity technologies added by Space Age that are replaced by Blueberry Productivity. (Except Rocket part productivity, because I like its icon better.)
